<!DOCTYPE html>
<html>
<head>
  <title>Gomoku Game</title>
  <style>
    body {
      display: flex;
      flex-direction: column; /* Stack UI elements vertically */
      align-items: center; /* Center elements horizontally */
      padding-top: 20px; /* Add some space at the top */
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .game-controls {
      margin-bottom: 20px; /* Space between controls and board */
      display: flex;
      align-items: center;
    }

    #newGameBtn {
      padding: 8px 15px;
      font-size: 16px;
      margin-right: 20px; /* Space between button and status */
      cursor: pointer;
    }

    #statusDisplay {
      font-size: 18px;
      font-weight: bold;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(15, 40px);
      grid-template-rows: repeat(15, 40px);
      border: 1px solid #000;
      position: relative; /* For positioning pieces */
    }

    .cell {
      width: 40px;
      height: 40px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative; /* So pieces can be positioned absolutely within the cell */
    }

    /*
      Traditional Gomoku pieces are placed on intersections, not in cells.
      The current .cell styling and piece placement within .cell is a simplification.
      For true intersection placement, pieces would need to be positioned absolutely
      relative to the .board, calculated based on cell size.
      E.g., a piece at (row, col) would be at top: row * 40 - 15, left: col * 40 - 15
      (assuming piece is 30x30 and cell is 40x40).
      The current approach places pieces in the center of a cell.
    */

    .piece {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      position: absolute;
      /* The piece is now a child of .cell, so it's positioned relative to the cell. */
      /* Centering it is simpler if the cell is flex container, but we want it on lines. */
      /* For simplicity, we'll center it in the cell for now. */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .black {
      background-color: black;
    }

    .white {
      background-color: white;
      border: 1px solid #555; /* Make white pieces visible on white cells */
    }
  </style>
</head>
<body>
  <div class="game-controls">
    <button id="newGameBtn">New Game</button>
    <div id="statusDisplay"></div>
  </div>
  <div class="board">
    <!-- Cells will be generated by JavaScript, or manually for testing -->
    <!-- Example of a few cells for structure visualization -->
    <script>
      const boardDiv = document.querySelector('.board');
      const newGameBtn = document.getElementById('newGameBtn');
      const statusDisplay = document.getElementById('statusDisplay');
      
      const BOARD_SIZE = 15;
      let boardState; // Will be initialized in resetGame
      let currentPlayer; // Will be initialized in resetGame
      let gameOver; // Will be initialized in resetGame

      function updateStatusDisplay() {
        if (gameOver) {
          statusDisplay.textContent = `Player ${boardState[lastWinRow][lastWinCol] === 1 ? 'Black' : 'White'} wins!`;
        } else {
          statusDisplay.textContent = `Current Player: ${currentPlayer === 1 ? 'Black' : 'White'}`;
        }
      }
      
      // Store last winning move to display correct winner
      let lastWinRow, lastWinCol; 

      function resetGame() {
        boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        currentPlayer = 1; // Black starts
        gameOver = false;
        
        // Clear visual pieces from the board
        const cells = boardDiv.querySelectorAll('.cell');
        cells.forEach(cell => {
          // Remove piece if it exists
          const piece = cell.querySelector('.piece');
          if (piece) {
            cell.removeChild(piece);
          }
        });
        
        updateStatusDisplay();
      }

      function placePiece(row, col, cellElement) {
        if (gameOver || boardState[row][col] !== 0) {
          return false;
        }

        boardState[row][col] = currentPlayer;
        const pieceDiv = document.createElement('div');
        pieceDiv.classList.add('piece');
        pieceDiv.classList.add(currentPlayer === 1 ? 'black' : 'white');
        
        // Instead of appending to boardDiv, append to the cell itself.
        // The CSS for .piece will position it centered within the .cell (due to relative positioning of cell)
        cellElement.appendChild(pieceDiv);

        return true;
      }

      function switchPlayer() {
        currentPlayer = currentPlayer === 1 ? 2 : 1;
        updateStatusDisplay();
      }

      function checkWin(row, col) {
        const player = boardState[row][col];
        if (player === 0) return false;
        
        // Store for status display if win
        lastWinRow = row; 
        lastWinCol = col;

        const directions = [
          { dr: 0, dc: 1 },  // Horizontal
          { dr: 1, dc: 0 },  // Vertical
          { dr: 1, dc: 1 },  // Diagonal \
          { dr: 1, dc: -1 }  // Diagonal /
        ];

        for (const { dr, dc } of directions) {
          let count = 1; // Count includes the current piece

          // Check in one direction
          for (let i = 1; i < 5; i++) {
            const r = row + dr * i;
            const c = col + dc * i;
            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && boardState[r][c] === player) {
              count++;
            } else {
              break;
            }
          }

          // Check in the opposite direction
          for (let i = 1; i < 5; i++) {
            const r = row - dr * i;
            const c = col - dc * i;
            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && boardState[r][c] === player) {
              count++;
            } else {
              break;
            }
          }

          if (count >= 5) {
            return true;
          }
        }
        return false;
      }

      function handleCellClick(event) {
        if (gameOver) return;

        const cell = event.currentTarget; // Use currentTarget to ensure it's the cell div
        const row = parseInt(cell.dataset.row);
        const col = parseInt(cell.dataset.col);

        if (boardState[row][col] === 0) {
          // placePiece will add the visual piece to the cell
          if (placePiece(row, col, cell)) {
            if (checkWin(row, col)) {
              gameOver = true;
              updateStatusDisplay(); // Update display with winner
              // Timeout to allow the piece to render before the alert, if desired
              setTimeout(() => alert(`Player ${boardState[row][col] === 1 ? 'Black' : 'White'} wins!`), 10);
            } else {
              switchPlayer(); // This will also call updateStatusDisplay
            }
          }
        }
      }

      // Generate board cells and add event listeners
      // This only needs to run once, not in resetGame
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener('click', handleCellClick);
          boardDiv.appendChild(cell);
        }
      }

      // Initial game setup
      newGameBtn.addEventListener('click', resetGame);
      resetGame(); // Call to initialize the game state and display on page load
    </script>
  </div>
</body>
</html>
